[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvs-analyzer"
version = "0.1.0"
description = "Python interface for the MVS Analyzer statistical engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MVS Analyzer contributors"}]
keywords = ["statistics", "repeated-measures", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/d1d2dopamine/MVS-Analyzer"

[tool.setuptools.packages.find]
where = ["src"]
