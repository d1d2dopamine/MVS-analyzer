name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v1.3.2)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run test harness
        run: dotnet run --project MvsAnalyzer.Tests/MvsAnalyzer.Tests.csproj -c Release

      - name: Publish self-contained single file
        run: >
          dotnet publish MvsAnalyzer.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Package release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main") {
            $version = "${{ github.event.inputs.tag }}"
          }
          $folder = "MVS_Analyzer_" + $version + "_win-x64"
          $root = Join-Path "staging" $folder
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item publish/MVS_Analyzer.exe $root/
          Copy-Item README.md, LICENSE, CHANGELOG.md $root/
          Copy-Item -Recurse examples (Join-Path $root "examples")
          Copy-Item *.mvsplugin $root/ -ErrorAction SilentlyContinue
          # Archive the folder itself, not its contents, so unzipping creates
          # one root directory instead of scattering files into the target.
          Compress-Archive -Path $root -DestinationPath "$folder.zip"
          Write-Host "Archive root check:"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "$folder.zip"))
          $zip.Entries | Select-Object -First 5 -ExpandProperty FullName
          $zip.Dispose()

      - name: Compute checksums
        shell: pwsh
        run: |
          Get-ChildItem -Filter "MVS_Analyzer_*_win-x64.zip" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii SHA256SUMS.txt
          }
          Get-Content SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            MVS_Analyzer_*_win-x64.zip
            SHA256SUMS.txt
          body: |
            ## MVS Analyzer ${{ github.ref_name }}

            Self-contained Windows x64 build. No .NET runtime installation required.

            **Verify before you trust:** compare the SHA-256 in `SHA256SUMS.txt`
            with the hash of the archive you downloaded.

            Engine and formula versions for this build are recorded in every
            `run_manifest.json` the app writes. See `CHANGELOG.md` for whether
            existing runs need to be repeated.
