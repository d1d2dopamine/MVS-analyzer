name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.4.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  linux-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Portable regressions
        run: dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release
      - name: Build Linux CLI
        run: dotnet publish MvsAnalyzer.Cli/MvsAnalyzer.Cli.csproj -c Release -o publish/cli
      - name: Calibration save and replay smoke
        run: |
          dotnet publish/cli/mvs.dll calibrate --in examples/demo_three_groups.csv --out artifacts/calibration --repetitions 150 --seed 20260719
          dotnet publish/cli/mvs.dll analyze --in examples/demo_three_groups.csv --calibration artifacts/calibration --out artifacts/analysis
          python tools/check_outputs.py artifacts
  release:
    needs: linux-check
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checked-out version and static contracts
        shell: pwsh
        run: |
          [xml]$project = Get-Content MvsAnalyzer.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag and application version disagree" }
          python tools/check_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run both regression harnesses
        shell: pwsh
        run: |
          dotnet run --project MvsAnalyzer.Tests/MvsAnalyzer.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows layout acceptance
        run: dotnet run --project MvsAnalyzer.Ui.Tests/MvsAnalyzer.Ui.Tests.csproj -c Release -- artifacts/ui-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-layout-review
          path: artifacts/ui-layout/
          if-no-files-found: warn
      - name: Publish Windows
        run: dotnet publish MvsAnalyzer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/windows
      - name: Publish Linux CLI
        run: dotnet publish MvsAnalyzer.Cli/MvsAnalyzer.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/linux
      - name: Package release assets
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $win = "MVS_Analyzer_${tag}_win-x64"
          $cli = "MVS_Analyzer_${tag}_linux-x64-cli"
          New-Item -ItemType Directory -Force "staging/$win", "staging/$cli" | Out-Null
          Copy-Item publish/windows/MVS_Analyzer.exe "staging/$win/"
          Copy-Item publish/linux/mvs "staging/$cli/"
          foreach ($folder in @($win, $cli)) {
            Copy-Item README.md, LICENSE, CHANGELOG.md, RELEASE_NOTES_v1.4.0.md "staging/$folder/"
            Copy-Item -Recurse docs, examples, notebooks "staging/$folder/"
            Copy-Item *.mvsplugin "staging/$folder/"
          }
          Compress-Archive -Path "staging/$win" -DestinationPath "$win.zip"
          Compress-Archive -Path "staging/$cli" -DestinationPath "$cli.zip"
          git archive --format=zip --prefix="MVS-Analyzer-$tag/" HEAD -o "MVS_Analyzer_${tag}_source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lines = Get-ChildItem MVS_Analyzer_*.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Create draft release for the requested tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MVS Analyzer ${{ env.RELEASE_TAG }}
          draft: true
          body_path: RELEASE_NOTES_v1.4.0.md
          files: |
            MVS_Analyzer_*_win-x64.zip
            MVS_Analyzer_*_linux-x64-cli.zip
            MVS_Analyzer_*_source.zip
            SHA256SUMS.txt
