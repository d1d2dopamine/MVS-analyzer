name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.5.0'
        required: true
        type: string
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify checked-out version and release tag
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse('MvsAnalyzer.Cli/MvsAnalyzer.Cli.csproj').getroot()
          version = root.findtext('.//Version')
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} and CLI version {version} disagree')
          PY

      - name: Validate source metadata, notebooks and method hashes
        run: |
          python tools/check_source.py
          python tools/check_cli_contract.py
          python tools/build_notebooks.py --check
      - name: Source and backup regressions
        run: |
          python tools/test_backups.py
          python tools/test_source.py
          python tools/test_paper_benchmark.py
          python tools/test_paper_benchmark_runner.py
          python tools/test_release_bundle.py
      - name: Python API wrapper tests
        run: |
          PYTHONPATH=python/src python -m unittest discover -s python/tests -v
          python tools/test_round2.py
      - name: Limited C# structural check
        run: python tools/check_csharp_structure.py
      - name: Independent mathematical identities in Python
        run: python validation/reference_numerics.py
      - name: Independent validation-tool regressions
        run: |
          python -m pip install -r validation/requirements-rank-reference.txt
          python -m unittest discover -s validation -p 'test_*.py' -v
          python validation/rank_test_reference.py --check

      - name: Portable scientific regressions
        run: dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release
      - name: Independent staged Huber numerical accuracy gate
        run: |
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-huber-diagnostics validation/huber-repair-fixtures-v1.json artifacts/huber-repaired-native.json
          python validation/huber_repair_reference.py --native artifacts/huber-repaired-native.json --core-assembly MvsAnalyzer.Core.Tests/bin/Release/net8.0/MvsAnalyzer.Core.dll --out artifacts/huber-repaired-comparison.json
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-huber-diagnostics validation/huber-fixtures-v1.json artifacts/huber-original20-repaired-native.json
          python validation/huber_reference.py --native artifacts/huber-original20-repaired-native.json --out artifacts/huber-original20-repaired-comparison.json
      - name: Independent closed-intersection check of internal multiplicity
        run: |
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-multiplicity-diagnostics validation/multiplicity-fixtures-v1.json artifacts/multiplicity-native.json
          python validation/multiplicity_reference.py --native artifacts/multiplicity-native.json --output artifacts/multiplicity-comparison.json
      - name: Independent unused single-step maxT arithmetic gate
        run: |
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-maxt-diagnostics validation/maxt-fixtures-v1.json artifacts/maxt-native.json
          python validation/maxt_reference.py --native artifacts/maxt-native.json --core-assembly MvsAnalyzer.Core.Tests/bin/Release/net8.0/MvsAnalyzer.Core.dll --out artifacts/maxt-comparison.json
      - name: Reconcile native benchmark diagnostic exports
        run: |
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-benchmark-diagnostics artifacts/benchmark-diagnostics
          python validation/check_benchmark_diagnostics.py artifacts/benchmark-diagnostics
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess
          import sys
          reports = sorted(Path('artifacts/benchmark-diagnostics/pipeline').glob('MVS_Benchmark_*'))
          if not reports:
              raise SystemExit('No end-to-end benchmark report found')
          for report in reports:
              subprocess.run([sys.executable, 'validation/check_benchmark_diagnostics.py', str(report)], check=True)
          PYCODE
      - name: Publish Linux CLI
        run: dotnet publish MvsAnalyzer.Cli/MvsAnalyzer.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/linux
      - name: Calibration and analysis smoke
        run: |
          ./publish/linux/mvs calibrate --in examples/demo_three_groups.csv --out artifacts/calibration --repetitions 150 --seed 20260719
          ./publish/linux/mvs analyze --in examples/demo_three_groups.csv --calibration artifacts/calibration --out artifacts/analysis
      - name: Validate outputs and machine protocol
        run: |
          python tools/check_outputs.py artifacts
          python tools/check_cli_contract.py --artifacts artifacts
      - name: Actual CLI input preservation and error regressions
        run: python tools/test_cli_safety.py --cli publish/linux/mvs --artifacts artifacts/cli-safety
      - name: Full scientific result parity against built CLI
        run: python tools/test_python_cli.py --cli publish/linux/mvs --artifacts artifacts
      - name: Reproduce scores from real CLI exports
        run: |
          python -m pip install -r validation/requirements.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          exports = sorted(Path('artifacts').rglob('results.csv'))
          if not exports:
              raise SystemExit('No results CSV exports found')
          for path in exports:
              subprocess.run([sys.executable, 'validation/analyze_results.py', str(path), '--draws', '20'], check=True)
          PY
      - name: Build Python wheel
        run: python -m pip wheel ./python --no-deps -w publish/python
      - name: Invalid explicit numbers must fail
        run: |
          if ./publish/linux/mvs calibrate --in examples/demo_three_groups.csv --out artifacts/invalid --repetitions not-a-number; then
            echo 'Malformed argument was accepted'; exit 1
          fi

      - name: Package release assets
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          cli="MVS_Analyzer_${tag}_linux-x64-cli"
          python tools/package_release_bundle.py --root . --cli publish/linux/mvs --out "staging/$cli"
          (cd staging && zip -qr "../$cli.zip" "$cli")
          git archive --format=zip --prefix="MVS-Analyzer-$tag/" HEAD -o "MVS_Analyzer_${tag}_source.zip"
          sha256sum "MVS_Analyzer_${tag}_linux-x64-cli.zip" "MVS_Analyzer_${tag}_source.zip" publish/python/*.whl > SHA256SUMS.txt

      - name: Create draft release for the requested tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MVS Analyzer ${{ env.RELEASE_TAG }}
          draft: true
          body_path: .github/RELEASE_NOTES.md
          files: |
            MVS_Analyzer_*_linux-x64-cli.zip
            MVS_Analyzer_*_source.zip
            SHA256SUMS.txt
            publish/python/*.whl
