name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source metadata, notebooks and method hashes
        run: python tools/check_source.py
      - name: Offline Colab and source-check regressions
        run: |
          python tools/test_colab.py
          python tools/test_source.py
      - name: Limited C# structural check (not compilation)
        run: python tools/check_csharp_structure.py
      - name: Independent mathematical identities in Python
        run: python validation/reference_numerics.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Colab source payload
        run: python tools/build_colab_payload.py --check
      - name: Build desktop
        run: dotnet build MvsAnalyzer.csproj -c Release
      - name: Desktop-linked regression harness
        run: dotnet run --project MvsAnalyzer.Tests/MvsAnalyzer.Tests.csproj -c Release
      - name: Portable scientific regressions on Windows
        run: dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release
      - name: Export Windows serialization fixtures
        run: dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release -- --export-portability artifacts/portable-states
      - uses: actions/upload-artifact@v7
        with:
          name: MVS-calibration-fixtures-windows
          path: artifacts/portable-states/
          if-no-files-found: error
      - name: Native Windows layout checks
        run: dotnet run --project MvsAnalyzer.Ui.Tests/MvsAnalyzer.Ui.Tests.csproj -c Release -- artifacts/ui-layout
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MVS-Windows-layout-review
          path: artifacts/ui-layout/
          if-no-files-found: warn
      - name: Publish Windows application
        run: dotnet publish MvsAnalyzer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/windows
      - uses: actions/upload-artifact@v7
        with:
          name: MVS-Analyzer-v1.4.0-win-x64
          path: publish/windows/
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Portable scientific regressions on Linux
        run: dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release
      - name: Export Linux serialization fixtures
        run: dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release -- --export-portability artifacts/portable-states
      - uses: actions/upload-artifact@v7
        with:
          name: MVS-calibration-fixtures-linux
          path: artifacts/portable-states/
          if-no-files-found: error
      - name: Publish Linux CLI
        run: dotnet publish MvsAnalyzer.Cli/MvsAnalyzer.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/linux-cli
      - name: Regression for the reported 150-replication save failure
        run: ./publish/linux-cli/mvs calibrate --in examples/demo_three_groups.csv --out artifacts/calibration --repetitions 150 --seed 20260719
      - name: Reload calibration and export analysis
        run: ./publish/linux-cli/mvs analyze --in examples/demo_three_groups.csv --calibration artifacts/calibration --out artifacts/analysis
      - name: Validate strict JSON, frozen state and manifest checksums
        run: python tools/check_outputs.py artifacts
      - name: Invalid explicit numbers must fail
        shell: bash
        run: |
          if ./publish/linux-cli/mvs calibrate --in examples/demo_three_groups.csv --out artifacts/invalid --repetitions not-a-number; then
            echo 'Malformed argument was accepted'; exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MVS-linux-smoke-and-cli
          path: |
            artifacts/
            publish/linux-cli/
          if-no-files-found: warn

  state-portability:
    needs: [windows, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            peer: windows
          - os: windows-latest
            peer: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: MVS-calibration-fixtures-${{ matrix.peer }}
          path: artifacts/peer-states
      - name: Read calibration from the other operating system
        run: dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release -- --verify-portability artifacts/peer-states
      - name: Build CLI for native state preflight
        run: dotnet publish MvsAnalyzer.Cli/MvsAnalyzer.Cli.csproj -c Release -o publish/state-cli -p:UseAppHost=false
      - name: Verify the notebook's native preflight command
        run: python tools/check_portability.py artifacts/peer-states publish/state-cli/mvs.dll
