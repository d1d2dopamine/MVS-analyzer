name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "CITATION.cff"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: |
          dotnet restore MvsAnalyzer.csproj
          dotnet restore MvsAnalyzer.Tests/MvsAnalyzer.Tests.csproj

      - name: Build application
        run: dotnet build MvsAnalyzer.csproj -c Release --no-restore /warnaserror:CS8600,CS8602,CS8618

      - name: Build tests
        run: dotnet build MvsAnalyzer.Tests/MvsAnalyzer.Tests.csproj -c Release --no-restore

      - name: Run test harness
        run: dotnet run --project MvsAnalyzer.Tests/MvsAnalyzer.Tests.csproj -c Release --no-build

      - name: Publish self-contained build
        run: >
          dotnet publish MvsAnalyzer.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MVS_Analyzer-win-x64
          path: publish/MVS_Analyzer.exe
          if-no-files-found: error
          retention-days: 14

  verify-formula:
    name: Formula hash is frozen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Formula version and frozen hash must match the docs
        shell: bash
        run: |
          set -euo pipefail

          # FormulaHash is computed at runtime from FormulaSpecification, so the
          # literal never appears in OutputExporter.cs. The frozen value lives in
          # the test harness; this job only checks that code and docs agree.
          grep -q 'const string FormulaVersion' OutputExporter.cs || {
            echo "::error file=OutputExporter.cs::FormulaVersion constant not found"
            exit 1
          }

          version=$(grep -oE 'MVS-[0-9]+\.[0-9]+\.[0-9]+' OutputExporter.cs | head -1 || true)
          hash=$(grep -oE '"[0-9a-f]{64}"' MvsAnalyzer.Tests/Program.cs | tr -d '"' | head -1 || true)

          if [ -z "$version" ]; then
            echo "::error file=OutputExporter.cs::formula version could not be read"
            exit 1
          fi

          if [ -z "$hash" ]; then
            echo "::error file=MvsAnalyzer.Tests/Program.cs::the frozen formula hash is not pinned in the test harness"
            exit 1
          fi

          echo "Formula version: $version"
          echo "Frozen hash:     $hash"

          status=0
          for file in README.md docs/METHODS.md CITATION.cff; do
            grep -qF "$version" "$file" || {
              echo "::error file=$file::formula version $version is not documented here"
              status=1
            }
            grep -qF "$hash" "$file" || {
              echo "::error file=$file::frozen hash $hash is not documented here"
              status=1
            }
          done

          if [ "$status" -ne 0 ]; then
            exit 1
          fi

          echo "Formula version and frozen hash match the documentation."
