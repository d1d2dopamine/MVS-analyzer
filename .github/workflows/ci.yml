name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate source metadata, notebooks and method hashes
        run: |
          python tools/check_source.py
          python tools/check_cli_contract.py
          python tools/build_notebooks.py --check
      - name: Source and backup regressions
        run: |
          python tools/test_backups.py
          python tools/test_source.py
          python tools/test_paper_benchmark.py
          python tools/test_paper_benchmark_runner.py
          python tools/test_release_bundle.py
      - name: Reviewed source pins and broader Colab contracts
        run: |
          node --version
          python tools/test_source_pins.py
          python tools/test_root_layout.py
          python tools/test_colab_connection.py
          python tools/test_ui_patch.py
      - name: Versioned benchmark registry and evidence table
        run: python validation/benchmark_suite.py --root . --check
      - name: Python API wrapper tests
        run: |
          PYTHONPATH=python/src python -m unittest discover -s python/tests -v
          python tools/test_round2.py
      - name: Limited C# structural check
        run: python tools/check_csharp_structure.py
      - name: Independent mathematical identities in Python
        run: python validation/reference_numerics.py
      - name: Independent validation-tool regressions
        run: |
          python -m pip install -r validation/requirements-rank-reference.txt
          python -m unittest discover -s validation -p 'test_*.py' -v
          python validation/rank_test_reference.py --check

  cli-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            8.0.425
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Portable scientific regressions
        run: dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release
      - name: Independent staged Huber numerical accuracy gate
        run: |
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-huber-diagnostics validation/huber-repair-fixtures-v1.json artifacts/huber-repaired-native.json
          python validation/huber_repair_reference.py --native artifacts/huber-repaired-native.json --core-assembly MvsAnalyzer.Core.Tests/bin/Release/net8.0/MvsAnalyzer.Core.dll --out artifacts/huber-repaired-comparison.json
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-huber-diagnostics validation/huber-fixtures-v1.json artifacts/huber-original20-repaired-native.json
          python validation/huber_reference.py --native artifacts/huber-original20-repaired-native.json --out artifacts/huber-original20-repaired-comparison.json
      - name: Independent closed-intersection check of internal multiplicity
        run: |
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-multiplicity-diagnostics validation/multiplicity-fixtures-v1.json artifacts/multiplicity-native.json
          python validation/multiplicity_reference.py --native artifacts/multiplicity-native.json --output artifacts/multiplicity-comparison.json
      - name: Independent unused single-step maxT arithmetic gate
        run: |
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-maxt-diagnostics validation/maxt-fixtures-v1.json artifacts/maxt-native.json
          python validation/maxt_reference.py --native artifacts/maxt-native.json --core-assembly MvsAnalyzer.Core.Tests/bin/Release/net8.0/MvsAnalyzer.Core.dll --out artifacts/maxt-comparison.json
      - name: Reconcile native benchmark diagnostic exports
        run: |
          dotnet run --project MvsAnalyzer.Core.Tests/MvsAnalyzer.Core.Tests.csproj -c Release --no-build -- --export-benchmark-diagnostics artifacts/benchmark-diagnostics
          python validation/check_benchmark_diagnostics.py artifacts/benchmark-diagnostics
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess
          import sys
          reports = sorted(Path('artifacts/benchmark-diagnostics/pipeline').glob('MVS_Benchmark_*'))
          if not reports:
              raise SystemExit('No end-to-end benchmark report found')
          for report in reports:
              subprocess.run([sys.executable, 'validation/check_benchmark_diagnostics.py', str(report)], check=True)
          PYCODE
      - name: Native failure diagnostic contract
        run: python tools/test_failure_reporting.py --assembly MvsAnalyzer.Core.Tests/bin/Release/net8.0/MvsAnalyzer.Core.Tests.dll --out regression-evidence/failure-reporter
      - name: Partial export error evidence regressions
        run: |
          dotnet build MvsAnalyzer.Cli/MvsAnalyzer.Cli.csproj -c Release
          dotnet run --project validation/partial_output_harness/PartialOutputHarness.csproj -c Release -- --candidate "$PWD/MvsAnalyzer.Cli/bin/Release/net8.0/mvs.dll" --out "$PWD/regression-evidence/partial-output"
          MVS_PARTIAL_OUTPUT_RESULTS="$PWD/regression-evidence/partial-output/report.json" python -m unittest discover -s validation -p 'test_partial_output_contract.py' -v
      - name: Resumed partial export evidence regressions
        run: |
          dotnet run --project validation/resume_output_harness/ResumeOutputHarness.csproj -c Release -- --candidate "$PWD/MvsAnalyzer.Cli/bin/Release/net8.0/mvs.dll" --out "$PWD/regression-evidence/resume-output"
          MVS_RESUME_OUTPUT_RESULTS="$PWD/regression-evidence/resume-output/report.json" python -m unittest discover -s validation -p 'test_resume_output_contract.py' -v
      - name: Successful overwrite artifact ownership regressions
        run: |
          dotnet run --project validation/overwrite_output_harness/OverwriteOutputHarness.csproj -c Release -- --candidate "$PWD/MvsAnalyzer.Cli/bin/Release/net8.0/mvs.dll" --out "$PWD/regression-evidence/overwrite-output"
          MVS_OVERWRITE_OUTPUT_RESULTS="$PWD/regression-evidence/overwrite-output/report.json" python -m unittest discover -s validation -p 'test_overwrite_output_contract.py' -v
      - name: Benchmark export artifact ownership regressions
        run: |
          dotnet build validation/benchmark_export_contract/BenchmarkExportContract.csproj -c Release
          dotnet validation/benchmark_export_contract/bin/Release/net8.0/BenchmarkExportContract.dll "$PWD/MvsAnalyzer.Cli/bin/Release/net8.0/mvs.dll" "$PWD/regression-evidence/benchmark-export"
          MVS_BENCHMARK_EXPORT_RESULTS="$PWD/regression-evidence/benchmark-export/report.json" python -m unittest discover -s validation -p 'test_benchmark_export_contract.py' -v
      - name: Independent native scenario mechanism synthetic gate
        env:
          DOTNET_PROCESSOR_COUNT: '1'
          MVS_DISABLE_BACKUPS: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          dotnet --list-runtimes | grep -E '^Microsoft\.NETCore\.App 8\.0\.31 '
          python -m pip install -r validation/requirements-rank-reference.txt
          dotnet build validation/scenario_mechanism/ScenarioMechanism.csproj -c Release
          python validation/scenario_mechanism.py synthetic --root "$PWD" --out "$RUNNER_TEMP/mvs-r47-synthetic" --native-command "$(command -v dotnet)" "$PWD/validation/scenario_mechanism/bin/Release/net8.0/MvsAnalyzer.Core.Tests.dll"
      - name: Retain scenario mechanism synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MVS-scenario-mechanism-synthetic
          path: ${{ runner.temp }}/mvs-r47-synthetic/
          if-no-files-found: warn
      - name: Independent bounded variance-fit numerical gate
        env:
          DOTNET_PROCESSOR_COUNT: '1'
          MVS_DISABLE_BACKUPS: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          dotnet --list-runtimes | grep -E '^Microsoft\.NETCore\.App 8\.0\.31 '
          python -m pip install -r validation/requirements-rank-reference.txt
          dotnet build validation/variance_fit_reference/VarianceFitReference.csproj -c Release
          python validation/variance_fit_reference.py --root "$PWD" --out "$RUNNER_TEMP/mvs-r48-variance-fit" --native-command "$(command -v dotnet)" "$PWD/validation/variance_fit_reference/bin/Release/net8.0/MvsAnalyzer.Core.Tests.dll"
      - name: Retain variance-fit numerical evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MVS-variance-fit-numerical
          path: ${{ runner.temp }}/mvs-r48-variance-fit/
          if-no-files-found: warn
      - name: Deterministic variance generator and report contract
        env:
          DOTNET_PROCESSOR_COUNT: '1'
          MVS_DISABLE_BACKUPS: '1'
        run: |
          dotnet build validation/variance_bootstrap_contract/VarianceBootstrapContract.csproj -c Release
          dotnet validation/variance_bootstrap_contract/bin/Release/net8.0/MvsAnalyzer.Core.Tests.dll identity > "$RUNNER_TEMP/mvs-r49-identity.json"
          python - <<'PYCODE'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'validation')
          import variance_bootstrap_contract as audit
          root = Path.cwd()
          identity = json.loads((Path(os.environ['RUNNER_TEMP']) / 'mvs-r49-identity.json').read_text())
          seal = audit.prepare_seal(root, root / 'validation/variance-bootstrap-fixtures-v1.json', root / 'docs/ROUND49_VARIANCE_BOOTSTRAP_PROTOCOL.md', root / 'validation/variance_bootstrap_contract/bin/Release/net8.0/MvsAnalyzer.Core.Tests.dll', identity)
          audit.atomic_json(Path(os.environ['RUNNER_TEMP']) / 'mvs-r49-seal.json', seal)
          PYCODE
          python validation/variance_bootstrap_contract.py --root "$PWD" --fixtures validation/variance-bootstrap-fixtures-v1.json --protocol docs/ROUND49_VARIANCE_BOOTSTRAP_PROTOCOL.md --seal "$RUNNER_TEMP/mvs-r49-seal.json" --out "$RUNNER_TEMP/mvs-r49-contract" --native-command "$(command -v dotnet)" "$PWD/validation/variance_bootstrap_contract/bin/Release/net8.0/MvsAnalyzer.Core.Tests.dll"
      - name: Retain variance generator and report evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MVS-variance-bootstrap-contract
          path: |
            ${{ runner.temp }}/mvs-r49-contract/
            ${{ runner.temp }}/mvs-r49-identity.json
            ${{ runner.temp }}/mvs-r49-seal.json
          if-no-files-found: warn
      - name: Publish Linux CLI
        run: dotnet publish MvsAnalyzer.Cli/MvsAnalyzer.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/linux-cli
      - name: Calibration and analysis smoke
        run: |
          ./publish/linux-cli/mvs calibrate --in examples/demo_three_groups.csv --out artifacts/calibration --repetitions 150 --seed 20260719
          ./publish/linux-cli/mvs analyze --in examples/demo_three_groups.csv --calibration artifacts/calibration --out artifacts/analysis
      - name: Validate outputs and machine protocol
        run: |
          python tools/check_outputs.py artifacts
          python tools/check_cli_contract.py --artifacts artifacts
      - name: Actual CLI input preservation and error regressions
        run: python tools/test_cli_safety.py --cli publish/linux-cli/mvs --artifacts artifacts/cli-safety
      - name: Full scientific result parity against built CLI
        run: python tools/test_python_cli.py --cli publish/linux-cli/mvs --artifacts artifacts
      - name: Reproduce scores from real CLI exports
        run: |
          python -m pip install -r validation/requirements.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          exports = sorted(Path('artifacts').rglob('results.csv'))
          if not exports:
              raise SystemExit('No results CSV exports found')
          for path in exports:
              subprocess.run([sys.executable, 'validation/analyze_results.py', str(path), '--draws', '20'], check=True)
          PY
      - name: Build Python wheel
        run: python -m pip wheel ./python --no-deps -w publish/python
      - name: Invalid explicit numbers must fail
        run: |
          if ./publish/linux-cli/mvs calibrate --in examples/demo_three_groups.csv --out artifacts/invalid --repetitions not-a-number; then
            echo 'Malformed argument was accepted'; exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MVS-cli-python-smoke
          path: |
            artifacts/
            regression-evidence/
            publish/linux-cli/
            publish/python/
          if-no-files-found: warn
